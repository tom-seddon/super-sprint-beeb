# The game's discs, built on a push to ci-build (Tom, 2026-11-10: "the new CI branch can be fast-forwarded
# occasionally to generate a new build. Let's not have a build on every push to `main`"), or by hand from the
# Actions tab. The result is one zip, super-sprint-YYYYMMDD-HHMM-xxxxx.zip: the commit's time in UTC and the 5 hex
# digits the options screen shows, holding game.ssd and game.adl named the same way, time attack's ta.ssd and ta.adl
# as super-sprint-ta-YYYYMMDD-HHMM-xxxxx, and a README.txt for a PC, disc/README-pc.txt filled in (tools/disc_readme.py),
# its lines ending CR LF (Tom, 2026-11-14: "Please put all disk images in the same archive, and the disk's README as
# well", then "perhaps the zip should have a different README from the disk"). make release makes it all
# (tools/release.py), as it would here (Tom, 2026-11-15). It's published as a
# release of that name (Tom, 2026-11-10: "Please update the CI setup to make a release. Then it should be possible to
# download the results and check them that way"), its notes the commit and the files' SHA-256; a second run of the
# same commit replaces the zip.
#
# The build reads files made by running the ST original in Hatari (docs/st-traces.md), made here: Hatari 2.6.1
# built from the submodule extern/hatari by make hatari, as Ubuntu's 2.4.1 can't make them
# (docs/brief-ci-hatari-2026-11-10.md), and checked against docs/stfiles-sha256.txt, the Mac's. The binary is cached
# by the submodule's commit and given to make as HATARI, so make doesn't build it again (a restored build/hatari would
# be: the checkout's sources are newer than its objects). The suite isn't run: its traces want about 13 GB and hours
# on 2 CPUs.

name: Build the discs

on:
  push:
    branches: [ci-build]
  workflow_dispatch:

permissions:
  contents: write                       # (the release and its tag)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  discs:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out, with the submodules the build uses
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Fetch rich/baron (with its extern/richc), extern/hatari and the beeb-port-kit
        id: submodules
        run: |
          git submodule update --init --recursive --depth 1 rich/baron extern/hatari reference/beeb-port-kit
          echo "hatari=$(git rev-parse HEAD:extern/hatari)" >> "$GITHUB_OUTPUT"
          echo "HATARI=$RUNNER_TEMP/hatari/bin/hatari" >> "$GITHUB_ENV"   # (every make's: the cached one)

      - name: Install the packages for Baron and Hatari
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends ninja-build libsdl2-dev zlib1g-dev libreadline-dev

      - name: Set up Python 3.14
        id: python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Restore Hatari
        id: hatari-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ runner.temp }}/hatari/bin
          key: hatari-${{ steps.submodules.outputs.hatari }}-${{ runner.os }}-ubuntu-24.04

      - name: Build Hatari
        if: steps.hatari-cache.outputs.cache-hit != 'true'
        run: |
          make hatari
          mkdir -p "$RUNNER_TEMP/hatari/bin"
          cp build/hatari/src/hatari "$RUNNER_TEMP/hatari/bin/"

      - name: Save Hatari
        if: steps.hatari-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ runner.temp }}/hatari/bin
          key: ${{ steps.hatari-cache.outputs.cache-primary-key }}

      - name: Make the ST's files in Hatari
        run: |
          "$HATARI" --version || true   # (it prints, then exits 1; tools/hatari.sh checks it's 2.5.0 or later)
          make -j2 PYTHON3='${{ steps.python.outputs.python-path }}' stfiles

      - name: Check them against the Mac's
        run: |
          if ! sha256sum --quiet -c docs/stfiles-sha256.txt; then
            echo "::error::The ST's files differ from docs/stfiles-sha256.txt (made on the Mac). If a tracer changed, make that list again; if not, Hatari here made something else."
            exit 1
          fi

      - name: Build the discs
        run: make -j2 PYTHON3='${{ steps.python.outputs.python-path }}' game

      - name: Build time attack's discs
        run: make -j2 PYTHON3='${{ steps.python.outputs.python-path }}' ta     # (not with game's: they share build/sprint.*)

      - name: Name and zip them
        id: zip
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git status --porcelain
            echo "::error::The tree has changes, so the version would end in m"
            exit 1
          fi
          make PYTHON3='${{ steps.python.outputs.python-path }}' release   # (tools/release.py: dist, and name and files here)
          df -h . | tail -1
          du -sh build .venv "$RUNNER_TEMP/hatari"

      - name: Release the zip
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          NAME: ${{ steps.zip.outputs.name }}
          FILES: ${{ steps.zip.outputs.files }}
        run: |
          {
            echo "Built from $(git log -1 --format='%h, %s')."
            echo
            echo 'SHA-256:'
            echo
            echo '```'
            (cd dist && sha256sum $FILES "$NAME.zip")
            echo '```'
          } > dist/notes.md
          if gh release view "$NAME" > /dev/null 2>&1; then
            gh release upload "$NAME" "dist/$NAME.zip" --clobber
            gh release edit "$NAME" --notes-file dist/notes.md
          else
            gh release create "$NAME" "dist/$NAME.zip" --target "$GITHUB_SHA" --title "$NAME" --notes-file dist/notes.md
          fi
